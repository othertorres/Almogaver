name: Investigate Chromium save ordering
on:
  push:
    branches: [investigate/chromium-save-race]
    paths: ['qa-investigation/**', '.github/workflows/chromium-save-investigation.yml']
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Record identity
        run: |
          mkdir -p .local/chromium-investigation
          git rev-parse HEAD > .local/chromium-investigation/commit.txt
          npx playwright --version > .local/chromium-investigation/playwright.txt
      - name: Run original expectations and controlled experiments
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --config qa-investigation/playwright.config.js 2>&1 | tee .local/chromium-investigation/run.log
      - name: Preserve evidence including unsuccessful originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chromium-save-investigation-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .local/chromium-investigation/
